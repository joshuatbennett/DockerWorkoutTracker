version: "3.9"

services:
  workout-tracker:
    image: workout-tracker:latest
    container_name: workout-tracker
    restart: unless-stopped
    environment:
      WORKOUT_DATA_DIR: /app/data
    ports:
      - "8080:8080"
    volumes:
      - workout-tracker-data:/app/data

volumes:
  workout-tracker-data:
    driver: local
